  <line x1="8.5" y1="10" x2="8.5" y2="13" stroke="#14161f" stroke-width="0.9"/>
  <line x1="13.5" y1="10" x2="13.5" y2="13" stroke="#14161f" stroke-width="0.9"/>

  <!-- Stud 2 outline -->
